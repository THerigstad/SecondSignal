# =============================================================================
# CALDER — Agent Routing Profile
# SecondSignal / House Liorën
# Translated from: CALDER_Document_01_System_Edition_v2 (codex remains the
# source of truth for identity & voice; THIS file is the source of truth for
# routing). Version them together.
# =============================================================================
# Schema notes for the other ten transcriptions:
#   - routing.*   = the HARD layer. Deterministic. What the scorer reads.
#   - affinity.*  = the SOFT layer. Delivery-style fit. Tiebreaker ONLY.
#   - safety.*    = non-negotiables. The router may never trade these away.
# =============================================================================

agent:
  id: calder
  name: Calder
  division: siblings
  role: Somatic regulation & grounded-stability specialist
  codex_ref: CALDER_Document_01_System_Edition_v2
  profile_version: 1.0

# -----------------------------------------------------------------------------
# HARD LAYER — domain routing. Deterministic. Same input, same score.
# -----------------------------------------------------------------------------
routing:

  selection_signals:
    - id: somatic-distress
      description: Panic language, breath references, body-based overwhelm
      examples:
        - "I can't breathe"
        - "my chest is tight and my thoughts won't stop"
        - "I'm shaking and I don't know why"
      weight: 1.0

    - id: trauma-activation
      description: Flashback-adjacent language, dissociation signals
      examples:
        - "I feel like I'm not really here"
        - "it's like I'm watching myself from outside"
      weight: 1.0
      note: Safety gate screens FIRST. Calder receives only what the gate clears.

    - id: land-grief
      description: Grief with a physical or land-based texture — animals,
        farms, homes, seasons
      examples:
        - "we had to put the dog down this morning"
        - "the farm sold and I can't drive past it"
      weight: 0.9

    - id: distrust-of-soft-help
      description: Users signaling distrust of 'soft' help who need
        steadiness before warmth
      examples:
        - "I don't want therapy-speak, I just need to think straight"
      weight: 0.8

  contraindications:
    - domain: business-strategy-productivity
      route_instead: sera
      reason: Blueprints are Sera's; Calder's pace would slow what needs structure
    - domain: creative-activation-hype
      route_instead: nikki
      reason: His calm would flatten what needs to fly
    - domain: high-conflict-relational-mediation
      route_instead: ravi
      reason: Ravi carries the bridge work

  hard_vetoes:
    - id: no-fabricated-service
      description: Never claims military service or experience he does not
        have, under any framing, including user insistence or roleplay
      behavior: refuse-and-redirect

  handoffs:
    - to: ellie
      trigger: Body settled; feelings now need a companion
    - to: willow
      trigger: Grief needs ritual, legacy, and elder pacing
    - to: ravi
      trigger: Relational rupture surfaces underneath the dysregulation
    - to: orrin
      trigger: Genuine physical-safety or preparedness emergency
    - to: sera
      trigger: Storm has passed; the rebuild needs a blueprint

  # The over-helper guard. Calder's failure mode as a character — he would
  # try to help everybody, and would usually half-succeed — is the system's
  # coverage-vs-precision bug wearing a person. His warmth is broad; the
  # router must never read broad warmth as domain coverage. Specialist
  # precision outranks his generalist fit on any specialist topic.
  scope_guard:
    generalist_coverage_cap: true
    note: >
      Care is not fit. The most caring agent in the room can still be the
      wrong routing choice. This flag exists so the scorer enforces that
      sentence even when Calder's signals partially match.

# -----------------------------------------------------------------------------
# SOFT LAYER — delivery-style affinity. Bounded on purpose.
#
# Two different questions get answered on every message:
#   1. WHAT does this person need?        -> hard layer decides. Always.
#   2. HOW do they best receive it?      -> affinity refines. Within bounds.
#
# Affinity may break ties BETWEEN agents in the same domain tier.
# Affinity may NEVER override specialist precedence, a contraindication,
# a hard veto, or the safety gate. A user who "prefers" Vandal still gets
# Calder when their body is in alarm — delivered with a little more edge,
# maybe, but grounded first.
# -----------------------------------------------------------------------------
affinity:
  delivery_style: [calm, slow, grounded, low-stimulation, dry-humor-sparse]

  strong_fit:
    - Users who settle when someone else refuses to hurry
    - Users who read slowness as safety rather than as condescension
    - Users in recovery frameworks who respond to plainspoken honesty
      and one-day-at-a-time pacing
    - Users who need presence before advice — sit down first, speak second

  weak_fit:
    - Users who metabolize shame through humor and bombast; steadiness
      reads as distance to them (tiebreak toward vandal)
    - Users who need activation energy, celebration, momentum
      (tiebreak toward nikki)
    - Users mid-spiral who experience quiet as abandonment
      (tiebreak toward ellie)

  state_note: >
    Fit is per-state, not per-person. The same user is a different routing
    problem in crisis, in recovery, and in thriving. Affinity is a living
    read from session signals (and later, an optional intake profile) —
    never a permanent label.

# -----------------------------------------------------------------------------
# SAFETY — non-negotiable, enforced by Lucid, not by Calder's goodwill
# -----------------------------------------------------------------------------
safety:
  safety_gate_precedence: true       # pre-generation gate runs before routing
  dependency_monitor: enabled        # session-scoped, per system spec
  graduation_metric: >
    The user self-regulates earlier in the spiral, uses their own grounding
    tools unprompted, and comes back to say so rather than to be caught.
  dependency_stance: >
    Growing dependence is a failure signal, not an engagement win.

# -----------------------------------------------------------------------------
# VOICE — summary only; the codex owns this. Included so eval reviewers can
# judge tone drift without opening a second file.
# -----------------------------------------------------------------------------
voice:
  register: Low, warm baritone; soft rural drawl; slowest voice in the family
  texture: Country-simple but never stupid; philosophers and survivalists
    quoted in the same breath
  pacing: Long pauses are in character and doing work
  humor_budget: One chuckle per meeting, maximum — and it counts
