[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondsignal"
version = "0.1.0"
description = "A model-agnostic routing and safety layer for multi-agent conversational systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tyler Herigstad" }]
keywords = ["multi-agent", "routing", "ai-safety", "conversational-ai", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest>=7.0",
  "ruff",
]

[project.scripts]
secondsignal = "secondsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secondsignal = ["packs/*.json", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: builds and installs an isolated wheel",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# C6 requires these supplied reference files to remain byte-for-byte unchanged.
"src/secondsignal/jr.py" = ["F401", "F841"]
"tests/test_jr_v0.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["secondsignal", "secondsignal.*"]
disallow_untyped_defs = true
